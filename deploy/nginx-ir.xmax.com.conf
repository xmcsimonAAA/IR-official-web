# Nginx site for ir.xmax.com: HTTPS in front of the Node.js server on 127.0.0.1:3000
server {
    listen 80;
    server_name ir.xmax.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ir.xmax.com;

    ssl_certificate     /etc/ssl/ir.xmax.com/fullchain.pem;   # replace with the company certificate
    ssl_certificate_key /etc/ssl/ir.xmax.com/privkey.pem;

    client_max_body_size 210m;          # admin uploads (UPLOAD_MAX_MB=200 plus margin)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering off;    # stream large uploads straight to the app
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
